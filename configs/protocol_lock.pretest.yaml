    repeat_design: three_episode_seeds
    minimum_meaningful_effect_pp: 3.0
  R1:
    population: locked_corrupted_visual_test_pairs
    cell_relative_drop_percent_formula: 100_times_clean_map_minus_corrupted_map_divided_by_clean_map
    clean_map50_95_validity_floor: 0.05
    primary_cell_set: cartesian_product_of_2_locked_corruption_types_and_3_locked_severity_levels
    cell_aggregation: equal_weight_macro_mean_across_6_deterministic_type_by_severity_cells_within_each_diagonal_model_repeat
    estimand: paired_macro_relative_drop_percent
    key_contrast: multi_coal_macro_relative_drop_minus_generic_matched_macro_relative_drop
    repeat_design: three_diagonal_model_repeats
    secondary_reports:
    - per_type_severity_curve
    - absolute_drop
    - clean_performance
    invalid_if_clean_map_below_floor: true
    minimum_meaningful_effect_pp: 5.0
statistics:
  confidence_level: 0.95
  bootstrap_draws: 10000
  bootstrap_unit: smallest_independent_raw_group
  episode_bootstrap_unit: source_component_id
  paired_bootstrap_for_primary_contrasts: true
  repeat_layer_aggregation:
    branch_pairing_keys:
    - training_seed
    - fewshot_subset_seed_when_applicable
    episode_pairing_keys:
    - episode_seed
    deterministic_S1_reference_rule: pair_the_same_frozen_non_neural_prediction_with_each_gru_training_seed_for_effect_calculation_without_creating_reference_replicates
    within_each_bootstrap_draw: recompute_metric_per_complete_repeat_cell_then_equal_weight_mean_of_paired_effects
    absolute_endpoint_rule: recompute_metric_per_repeat_cell_then_equal_weight_mean
    repeat_variability_report: per_repeat_values_mean_and_standard_deviation
    missing_confirmatory_repeat_cell: block_endpoint
    no_seed_or_subset_row_is_an_independent_bootstrap_cluster: true
  secondary_multiplicity: holm
  secondary_alpha: 0.05
  mechanism_claim_family:
  - E3_RELIABILITY
  - E3_GRAPH
  - E3_MEMORY
  multiplicity_reporting: unadjusted_95_percent_ci_plus_holm_adjusted_p_value_and_decision
  superiority_rule:
    require_favorable_direction: true
    require_ci_excludes_zero: true
    require_minimum_meaningful_effect: true
  inconclusive_if_ci_crosses_zero: true
  retain_negative_results: true
