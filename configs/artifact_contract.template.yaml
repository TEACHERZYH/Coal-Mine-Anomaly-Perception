schema_version: 2
status: template_not_locked

common:
  null_tokens_forbidden: ["", "NA_AS_VALUE", "unknown_without_reason"]
  timestamp_format: iso8601_with_timezone
  hash_algorithm: sha256
  path_style_in_artifacts: posix_relative_to_artifact_root
  stable_id_encoding: utf8_nfc
  formal_write_mode: atomic_then_hash

artifacts:
  source_registry:
    format: csv
    primary_key: [dataset_id, source_version]
    required_columns:
      dataset_id: string
      source_version: string
      official_url_or_doi: string
      access_date: date
      license_id: string
      license_evidence_path: string
      access_mode: enum(open,application_required,restricted,reject)
      expected_modality: string
      expected_annotation: string
      planned_role: string
      verification_status: enum(pending,pass,reject,blocked)

  archive_manifest:
    format: csv
    primary_key: [dataset_id, archive_id]
    required_columns:
      dataset_id: string
      archive_id: string
      source_url_or_doi: string
      access_date: date
      license_id: string
      version: string
      local_or_remote_path: string
      byte_size: int64_nonnegative
      sha256: sha256
      acquisition_route: enum(local_existing,remote_existing,domestic_remote_download,local_download_upload)
      verification_status: enum(pass,reject,blocked)

  smoke_sample_manifest:
    format: csv
    primary_key: [dataset_id, smoke_record_id]
    required_columns:
      dataset_id: string
      smoke_record_id: string
      archive_id: string
      archive_sha256: sha256
      archive_member_path: string
      selection_rank: int64_positive
      selection_rule: string
      extraction_site: enum(local,remote_cu)
      local_minimal_path: string
      minimal_file_sha256: sha256
    constraints:
      - deterministic_bounded_sample_per_dataset
      - remote_only_archive_returns_minimal_members_not_full_archive_or_tree
      - no_full_local_extraction

  file_manifest:
    format: parquet
    primary_key: [dataset_id, record_id]
    required_columns:
      dataset_id: string
      record_id: string
      archive_id: string
      relative_path: string
      modality: string
      raw_group_id: string
      pair_id: nullable_string
      sequence_id: nullable_string
      timestamp_or_order: nullable_string
      label_summary_json: json_string
      byte_size: int64_nonnegative
      sha256: sha256
    foreign_keys:
      archive_id: archive_manifest.archive_id
    constraints:
      - relative_path_is_unique_within_dataset
      - raw_group_id_is_never_null
      - pair_id_is_required_only_for_declared_paired_roles

  ontology_lock:
    format: yaml
    primary_key: [ontology_version, dataset_id, source_label]
    required_fields:
      ontology_version: string
      dataset_id: string
      source_label: string
      canonical_concept_id: nullable_string
      mapping_status: enum(compatible,ignored,unmapped,reject)
      annotation_policy: string
      event_semantics: enum(observable_presence,annotated_anomaly,threshold_risk,not_event_eligible)
      negative_semantics: enum(exhaustive_verified_absence,unverified_missing_annotation,not_applicable)
      allowed_tasks: list
      evidence_reference: string
      reviewer_decision: string
    constraints:
      - no_name_only_mapping_without_annotation_evidence
      - incompatible_annotation_policies_not_merged
      - confirmatory_f1_requires_exhaustive_verified_absence_or_explicit_negative_label

  split_manifest:
    format: parquet
    primary_key: [dataset_id, record_id]
    required_columns:
      dataset_id: string
      record_id: string
      raw_group_id: string
      pool: enum(D_b_tr,D_b_sel,D_b_prob,D_b_te,D_e_tr,D_e_sel,D_e_pol,D_e_te)
      split_seed: int64
      split_version: string
      ontology_hash: sha256
      dedup_report_hash: sha256
    constraints:
      - one_raw_group_one_top_level_pool
      - no_exact_or_near_duplicate_cross_pool

  branch_detection_feature_view:
    format: parquet
    generated_at: E060
    primary_key: [dataset_id, record_id]
    required_columns:
      dataset_id: string
      record_id: string
      archive_id: string
      relative_path: string
      modality: enum(visible,thermal)
      raw_group_id: string
      pair_id: nullable_string
      sequence_id: nullable_string
      timestamp_or_order: nullable_string
      byte_size: int64_nonnegative
      sha256: sha256
    forbidden_columns: [label_summary_json,boxes,concept_truth,test_label]
    constraints:
      - contains_only_D_b_te_detection_records
      - predictor_reads_this_feature_only_view_instead_of_the_labeled_file_manifest

  branch_methane_feature_view:
    format: parquet
    generated_at: E050
    primary_key: [window_id]
    forbidden_columns: [event_truth,future_max,test_label]
    constraints:
      - contains_only_D_b_te_methane_windows
      - history_json_contains_only_causal_history_and_missingness_masks

  branch_test_feature_manifest:
    format: json
    generated_at: E060
    required_fields:
      schema_version: int32_positive
      scope: const(branch)
      pool: const(D_b_te)
      detection_features: object_path_hash_count
      methane_features: object_path_hash_count
    constraints:
      - hash_is_bound_as_test_seal_feature_manifest_hash
      - each_component_hash_and_row_count_is_reverified_at_E068_and_E206

  branch_detection_truth:
    format: parquet
    generated_at: E060
    primary_key: [dataset_id, record_id, box_id]
    required_columns:
      dataset_id: string
      record_id: string
      raw_group_id: string
      concept_id: string
      box_id: int64_nonnegative
      x1: float32
      y1: float32
      x2: float32
      y2: float32
    constraints:
      - stored_under_data_sealed
      - denied_to_training_selection_calibration_prediction_and_human_review_roles
      - released_only_after_all_branch_prediction_locks_close

  branch_concept_truth:
    format: parquet
    generated_at: E060
    primary_key: [dataset_id, record_id, concept_id]
    required_columns:
      dataset_id: string
      record_id: string
      raw_group_id: string
      concept_id: string
      concept_truth: int32_binary
    constraints:
      - complete_record_by_frozen_concept_cross_product
      - absent_concept_is_negative_only_when_annotation_absence_is_verified
      - stored_and_released_with_branch_detection_truth

  branch_methane_truth:
    format: parquet
    generated_at: E050
    primary_key: [window_id]
    required_columns:
      window_id: string
      raw_group_id: string
      sensor_group_id: string
      pool: const(D_b_te)
      timestamp_seconds: int64
      raw_value: float64
      event_truth: int32_binary
    constraints:
      - physically_separate_from_methane_non_test_truth
      - denied_to_training_selection_calibration_prediction_and_human_review_roles
      - hash_is_bound_into_branch_test_truth_manifest_at_E060

  branch_test_truth_manifest:
    format: json
    generated_at: E060
    required_fields:
      schema_version: int32_positive
      scope: const(branch)
      pool: const(D_b_te)
      detection_truth: object_path_hash_count
      concept_truth: object_path_hash_count
      methane_truth: object_path_hash_count
      record_count: int64_positive
      raw_group_count: int64_positive
    constraints:
      - hash_is_bound_as_test_seal_label_manifest_hash
      - each_sealed_truth_hash_and_row_count_is_reverified_at_E061_and_E206

  fewshot_manifest:
    format: parquet
    primary_key: [dataset_id, direction_id, ratio_percent, subset_seed, raw_group_id]
    required_columns:
      dataset_id: string
      direction_id: string
      ratio_percent: const(10)
      subset_seed: int64
      raw_group_id: string
      included: bool
      class_group_counts_json: json_string
      parent_manifest_hash: sha256
    constraints:
      - exactly_one_preregistered_10_percent_subset_per_direction_and_subset_seed
      - groups_only_from_D_b_tr

  rgbt_pair_manifest:
    format: parquet
    primary_key: [dataset_id, pair_id]
    required_columns:
      dataset_id: string
      pair_id: string
      raw_group_id: string
      visible_record_id: string
      thermal_record_id: string
      pair_provenance: enum(official_index,verified_filename_mapping,verified_timestamp_mapping)
      annotation_compatibility: enum(pass,reject)
      pool: string
    constraints:
      - visible_and_thermal_records_exist
      - both_records_share_raw_group_and_pool

  graph_eligibility:
    format: yaml
    primary_key: [concept_id, modality_a, modality_b, edge_provenance]
    required_fields:
      ontology_hash: sha256
      pair_manifest_hash: sha256
      concept_id: string
      modality_a: string
      modality_b: string
      edge_provenance: enum(observed_pair,virtual_compatibility)
      non_self_edge: bool
      pool_group_counts: mapping
      eligibility: enum(graph_primary,secondary_virtual_edge,branch_temporal_only,reject)
      reason: string
    constraints:
      - graph_primary_requires_observed_pair
      - graph_primary_requires_two_available_modalities
      - graph_primary_requires_group_floor_in_all_episode_pools

  fusion_eligibility:
    format: parquet
    generated_at: E058
    primary_key: [concept_id]
    required_columns:
      concept_id: string
      eligible_branch_types: list
      eligible_branch_type_count: int64_nonnegative
      independent_multibranch_positive_group_count: int64_nonnegative
      multibranch_event_count_by_pool: mapping
      fusion_primary_eligible: bool
      exclusion_reason: nullable_string
      ontology_lock_hash: sha256
      split_manifest_hash: sha256
      episode_skeleton_candidate_hash: sha256
    forbidden_columns: [model_score,validation_metric,test_metric,claim_direction]
    constraints:
      - primary_eligibility_requires_at_least_two_distinct_valid_branch_types
      - primary_eligibility_requires_the_locked_positive_group_floor
      - eligibility_is_computed_without_model_scores_or_test_metrics
      - empty_primary_population_blocks_fusion_memory_and_graph_claims

  dataset_roles:
    format: yaml
    primary_key: [role_id]
    required_fields:
      role_id: string
      dataset_ids: list
      direction_id: nullable_string
      allowed_claim_ids: list
      source_manifest_hash: nullable_sha256
      ontology_hash: sha256
      split_hash: sha256
      decision: enum(confirmatory,replication,exploratory_only,diagnostic_only,reject)
      decision_reason: string
    constraints:
      - selected_without_model_test_results
      - target_all_pools_excluded_from_direction_source_manifest

  methane_window_manifest:
    format: parquet
    primary_key: [dataset_id, window_id]
    required_columns:
      dataset_id: string
      window_id: string
      raw_group_id: string
      sensor_group_id: string
      history_start: timestamp
      history_end: timestamp
      forecast_end: timestamp
      pool: string
      target_sensor_variant: string
      feature_manifest_hash: sha256
      label_manifest_hash: sha256
    constraints:
      - history_precedes_forecast
      - purge_gap_covers_history_plus_horizon
      - normalization_fit_only_D_b_tr

  detection_predictions:
    format: parquet
    primary_key: [run_id, record_id, detection_id]
    required_columns:
      run_id: string
      record_id: string
      raw_group_id: string
      prediction_role: enum(branch_test,episode_pool)
      pool_role: enum(D_b_te,D_e_tr,D_e_sel,D_e_pol,D_e_te)
      detection_id: int64_nonnegative
      concept_id: string
      x1: float32
      y1: float32
      x2: float32
      y2: float32
      score_raw: float32_0_1
      score_calibrated: float32_0_1
      modality: string
      available: bool
      model_hash: sha256
      calibrator_hash: sha256
    forbidden_columns: [label,labels,ground_truth,truth_box,truth_class,test_label,dataset_id_as_feature]
    constraints:
      - branch_test_role_requires_D_b_te
      - episode_pool_role_requires_one_of_D_e_tr_D_e_sel_D_e_pol_D_e_te
      - episode_pool_predictions_use_the_E300_frozen_branch_generator_lock

  detection_concept_predictions:
    format: parquet
    primary_key: [run_id, record_id, concept_id, modality]
    required_columns:
      run_id: string
      record_id: string
      raw_group_id: string
      prediction_role: enum(branch_test,episode_pool)
      pool_role: enum(D_b_te,D_e_tr,D_e_sel,D_e_pol,D_e_te)
      concept_id: string
      modality: string
      step_score_raw: float32_0_1
      concept_probability_calibrated: float32_0_1
      available: bool
      detector_hash: sha256
      ontology_hash: sha256
      aggregation_rule_hash: sha256
      calibrator_hash: sha256
    forbidden_columns: [label,labels,ground_truth,truth_box,truth_class,concept_truth,test_label,dataset_id_as_feature]
    constraints:
      - exactly_one_row_per_record_retained_concept_and_modality
      - step_score_is_max_post_nms_compatible_box_score_else_zero
      - calibrator_is_selected_and_refit_only_on_D_b_prob
      - calibrated_probability_is_the_detection_feature_consumed_by_episode_builder
      - branch_test_role_requires_D_b_te
      - episode_pool_role_requires_one_of_D_e_tr_D_e_sel_D_e_pol_D_e_te
      - episode_pool_predictions_use_the_E300_frozen_branch_generator_lock
      - absence_truth_for_calibration_requires_exhaustive_verified_absence_or_explicit_negative_label

  temporal_predictions:
    format: parquet
    primary_key: [run_id, window_id, concept_id]
    required_columns:
      run_id: string
      window_id: string
      raw_group_id: string
      prediction_role: enum(branch_test,episode_pool)
      pool_role: enum(D_b_te,D_e_tr,D_e_sel,D_e_pol,D_e_te)
      concept_id: string
      score_raw: float32_0_1
      score_calibrated: float32_0_1
      abstained: bool
      model_hash: sha256
      policy_hash: sha256
    forbidden_columns: [future_value,event_truth,test_label,forecast_label]
    constraints:
      - branch_test_role_requires_D_b_te
      - episode_pool_role_requires_one_of_D_e_tr_D_e_sel_D_e_pol_D_e_te
      - episode_pool_predictions_use_the_E300_frozen_branch_generator_lock

  corruption_manifest:
    format: parquet
    primary_key: [record_id, corruption_type, severity]
    required_columns:
      record_id: string
      raw_group_id: string
      corruption_type: enum(low_light,dust_fog_proxy)
      severity: int32_1_3
      operator_version: string
      generator_hash: sha256
      parameter_json: json_string
      source_feature_hash: sha256
      corrupted_feature_hash: sha256
      label_independent: const_true
    constraints:
      - parameterization_frozen_before_PRETEST_LOCK
      - generation_inputs_exclude_boxes_labels_truth_predictions_and_saliency
      - same_record_type_and_severity_produces_identical_bytes
      - compared_models_share_exact_corrupted_feature_hash

  test_seal:
    format: json
    required_fields:
      scope: enum(branch,episode)
      stage: enum(candidate,final)
      split_hash: sha256
      feature_manifest_hash: sha256
      label_manifest_hash: sha256
      feature_acl: list
      label_acl: list
      artifact_contract_hash: sha256
      sealed_at: timestamp
      status: const(sealed)
    conditional_fields:
      candidate_seal_hash: required_for_final
      episode_skeleton_candidate_seal_hash: required_for_episode_final
      protocol_hash: required_for_final
      source_hash: required_for_final
      matrix_hash: required_for_final
    constraints:
      - training_selection_calibration_and_prediction_roles_denied_label_acl
      - evaluator_denied_until_matching_prediction_lock
      - protocol_embeds_candidate_hash_not_final_seal_hash_to_avoid_hash_cycle
      - episode_final_seal_binds_both_skeleton_and_label_candidate_seal_hashes
      - seal_is_append_only_and_never_mutated_on_release_or_invalidation
      - release_or_invalidation_is_a_separate_signed_artifact_referencing_the_seal_hash

  episode_test_seal_candidate:
    format: json
    generated_at: E301
    required_fields:
      scope: const(episode)
      stage: const(candidate)
      skeleton_manifest_hash: sha256
      skeleton_candidate_seal_hash: sha256
      feature_manifest_hash: sha256
      label_manifest_hash: sha256
      label_row_count: int64_nonnegative
      raw_group_count: int64_nonnegative
      label_acl: list
      acl_hash: sha256
      artifact_contract_hash: sha256
      created_at: timestamp
    forbidden_fields: [class_counts,event_rates,per_concept_rates,metric_summaries,label_samples]
    constraints:
      - E301_writes_test_labels_atomically_into_denied_acl_storage
      - training_selection_calibration_prediction_and_human_review_roles_are_denied
      - receipt_exposes_only_hashes_counts_and_acl_state
      - E302_final_seal_references_candidate_seal_hash_without_mutating_candidate
      - E302_final_seal_also_references_the_E058_skeleton_candidate_seal_hash

  episode_skeleton_manifest:
    format: parquet
    primary_key: [episode_id, step_index, concept_id, node_id]
    required_columns:
      skeleton_item_id: sha256
      episode_id: string
      step_index: int64_nonnegative
      record_id: string
      raw_group_id: string
      concept_id: string
      node_id: string
      pool: enum(D_e_tr,D_e_sel,D_e_pol,D_e_te)
      episode_seed: int64_positive
      generator_family_id: string
      template_instance_id: string
      template_family: enum(abrupt,gradual,intermittent,evidence_delay,evidence_conflict,modality_missingness)
      event_position_role: string
      source_split_hash: sha256
      template_lock_hash: sha256
    forbidden_columns: [model_score,model_prediction,validation_metric,test_metric,model_saliency,reliability_score]
    constraints:
      - skeleton_item_id_is_unique_opaque_and_uses_a_sealed_random_nonce
      - skeleton_item_id_hash_preimage_uses_an_independent_sealed_repeat_row_salt_and_excludes_episode_step_pool_template_event_and_truth_fields
      - skeleton_item_id_is_join_only_and_never_a_model_or_policy_feature
      - generated_and_hashed_at_E058_before_branch_test_release
      - every_record_belongs_to_its_locked_episode_pool
      - raw_group_assigned_to_one_episode_within_pool_and_episode_seed
      - test_skeleton_hash_is_bound_into_episode_test_seal
      - full_D_e_te_partition_is_atomically_written_to_denied_acl_candidate_storage_at_E058
      - trainer_selector_policy_predictor_and_human_review_roles_cannot_read_full_D_e_te_rows
      - E300_predictor_receives_only_the_truth_free_inference_projection

  episode_test_skeleton_candidate:
    format: json
    generated_at: E058
    required_fields:
      scope: const(episode_test_skeleton)
      schema_hash: sha256
      full_manifest_hash: sha256
      inference_projection_hash: sha256
      row_count: int64_nonnegative
      raw_group_count: int64_nonnegative
      acl_hash: sha256
      created_at: timestamp
    forbidden_fields: [event_counts,event_rates,event_positions,template_counts,per_concept_rates,label_samples]
    constraints:
      - full_test_skeleton_is_written_and_acl_verified_before_receipt_is_exposed
      - receipt_exposes_no_event_template_or_label_distribution
      - PRETEST_protocol_binds_candidate_hash_without_opening_full_rows

  episode_skeleton_inference_projection:
    format: parquet
    generated_at: E058
    primary_key: [skeleton_item_id]
    required_columns:
      skeleton_item_id: sha256
      record_id: string
      concept_id: string
      node_id: string
      generator_family_id: string
    forbidden_columns: [episode_id,step_index,raw_group_id,source_component_id,pair_id,pool,episode_seed,dataset_id,template_instance_id,event_position_role,event_truth,state_truth,test_label]
    constraints:
      - exactly_one_projection_row_per_full_skeleton_row
      - projection_hash_is_bound_into_episode_test_skeleton_candidate
      - E300_predictor_can_read_projection_but_not_full_D_e_te_skeleton
      - skeleton_item_id_is_used_only_for_join_and_output_keying

  episode_branch_feature_manifest:
    format: parquet
    generated_at: E058
    primary_key: [record_id]
    required_columns:
      dataset_id: string
      record_id: string
      raw_group_id: string
      pair_id: nullable_string
      modality: enum(visible,thermal,methane)
      feature_kind: enum(image_path,causal_history_json)
      relative_path: nullable_string
      history_json: nullable_json_string
      source_feature_sha256: sha256
    forbidden_columns: [pool,event_position_role,event_truth,state_truth,test_label,label,truth]
    constraints:
      - every_projection_record_resolves_to_exactly_one_truth_free_source_feature
      - image_and_methane_payloads_are_physically_separate_from_all_episode_truth
      - E300_may_read_this_manifest_but_not_the_full_skeleton_or_feature_audit

  episode_branch_predictions:
    format: parquet
    generated_at: E300
    primary_key: [skeleton_item_id]
    required_columns:
      skeleton_item_id: sha256
      record_id: string
      concept_id: string
      node_id: string
      modality: string
      step_score_raw: float32_0_1
      calibrated_probability: float32_0_1
      available: bool
      generator_family_id: string
      model_hash: sha256
      calibrator_or_policy_hash: sha256
      skeleton_manifest_hash: sha256
      skeleton_inference_projection_hash: sha256
    forbidden_columns: [episode_id,step_index,raw_group_id,source_component_id,pair_id,pool,dataset_id,template_instance_id,event_position_role,event_truth,state_truth,test_label]
    constraints:
      - exactly_one_prediction_row_for_every_E058_truth_free_inference_row
      - generator_family_and_model_hash_match_the_PRETEST_branch_generator_lock
      - detection_nodes_use_the_record_concept_calibrated_probability_contract
      - methane_nodes_use_the_locked_temporal_probability_contract
      - no_truth_audit_or_template_field_is_opened_or_written
      - all_four_episode_pool_partitions_close_before_E301

  episode_features:
    format: parquet
    primary_key: [episode_id, step_index, concept_id, node_id]
    required_columns:
      episode_id: string
      step_index: int64_nonnegative
      record_id: string
      concept_id: string
      node_id: string
      modality: string
      calibrated_probability: float32_0_1
      quality_vector_json: json_string
      available: bool
    forbidden_tensor_columns: [episode_id,step_index,record_id,raw_group_id,source_component_id,pair_id,pool,dataset_id,generator_family_id,template_instance_id,event_truth,state_truth]
    constraints:
      - predictor_acl_excludes_episode_feature_audit_and_episode_labels
      - tensor_builder_drops_join_and_sort_keys_before_model_forward
      - source_group_pair_pool_template_and_truth_columns_are_physically_absent
      - artifact_is_partitioned_into_separate_executable_pool_directory

  episode_feature_audit:
    format: parquet
    primary_key: [episode_id, step_index, concept_id, node_id]
    required_columns:
      episode_id: string
      step_index: int64_nonnegative
      record_id: string
      episode_seed: int64_positive
      raw_group_id: string
      source_component_id: string
      concept_id: string
      node_id: string
      pair_id: nullable_string
