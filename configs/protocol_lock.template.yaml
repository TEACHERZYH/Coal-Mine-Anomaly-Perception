      prediction_event_rule: maximal_contiguous_threshold_positive_window_endpoints_merged_when_gap_le_event_merge_gap_seconds
      prediction_event_time: first_positive_window_endpoint
      match_window: truth_start_minus_horizon_seconds_through_truth_end
      ongoing_alarm_started_before_match_window: false_alarm_and_not_a_detection
      event_macro_f1: equal_weight_mean_of_sensor_level_event_f1_over_G1_eligible_locked_sensors
      no_predicted_event_with_existing_truth: sensor_event_f1_zero
      false_alarm_denominator: valid_observed_sensor_hours_excluding_purge_and_invalid_gaps
      lead_time_formula: truth_start_minus_matched_prediction_onset_seconds
